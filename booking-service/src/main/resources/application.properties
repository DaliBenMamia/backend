spring.application.name=booking-service
server.port=8895
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:h2:mem:bookingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

user.service.base-url=${USER_SERVICE_URL:http://localhost:8893}
salon.service.base-url=${SALON_SERVICE_URL:http://localhost:8894}
auth.service.base-url=${AUTH_SERVICE_URL:http://localhost:8220}
external.auth.validation.enabled=${EXTERNAL_AUTH_VALIDATION_ENABLED:false}
external.user.validation.enabled=${EXTERNAL_USER_VALIDATION_ENABLED:false}
external.salon.validation.enabled=${EXTERNAL_SALON_VALIDATION_ENABLED:false}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
