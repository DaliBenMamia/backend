services:
  postgres:
    image: postgres:16
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking_db
      DB_USERNAME: booking_user
      DB_PASSWORD: booking_pass
      DB_DRIVER: org.postgresql.Driver
      SERVER_PORT: 8895
      USER_SERVICE_URL: http://host.docker.internal:8893
      SALON_SERVICE_URL: http://host.docker.internal:8894
      AUTH_SERVICE_URL: http://host.docker.internal:8220
      EXTERNAL_AUTH_VALIDATION_ENABLED: "false"
      EXTERNAL_USER_VALIDATION_ENABLED: "false"
      EXTERNAL_SALON_VALIDATION_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_DEFAULT_ZONE: http://host.docker.internal:8761/eureka
    ports:
      - "8895:8895"

volumes:
  postgres-data:
