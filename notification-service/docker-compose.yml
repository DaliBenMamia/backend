services:
  postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build: .
    container_name: notification-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_PORT: 8890
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_ENABLED: "false"
      APP_KAFKA_ENABLED: "false"
      APP_DELIVERY_ENABLED: "false"
      APP_DELIVERY_BASE_URL: http://notification-provider
      APP_DELIVERY_ENDPOINT: /api/deliveries
    ports:
      - "8890:8890"
    restart: unless-stopped

volumes:
  notification_pg_data:
