spring.application.name=notification-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${SERVER_PORT:8890}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.kafka.listener.missing-topics-fatal=false

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}

app.kafka.enabled=${APP_KAFKA_ENABLED:false}
app.delivery.enabled=${APP_DELIVERY_ENABLED:false}
app.delivery.base-url=${APP_DELIVERY_BASE_URL:http://notification-provider}
app.delivery.endpoint=${APP_DELIVERY_ENDPOINT:/api/deliveries}
