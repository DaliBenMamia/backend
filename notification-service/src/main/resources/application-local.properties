spring.datasource.url=jdbc:h2:mem:notificationdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
app.kafka.enabled=${APP_KAFKA_ENABLED:false}
app.delivery.enabled=${APP_DELIVERY_ENABLED:false}
