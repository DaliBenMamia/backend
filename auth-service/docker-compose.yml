services:
  postgres:
    image: postgres:16
    container_name: coifure-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coifure_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coifure_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coifure-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8220
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coifure_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ZmFrZV9zZWNyZXRfZm9yX2Rldl9vbmx5XzMyX2J5dGVzX2tleV8xMjM0NTY=
      APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 120
      APP_JWT_ISSUER: coifure-auth-service
      SPRING_PROFILES_ACTIVE: postgres
      EUREKA_ENABLED: "false"
    ports:
      - "8220:8220"

volumes:
  postgres_auth_data:
