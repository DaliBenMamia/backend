spring.application.name=auth-service
server.port=${SERVER_PORT:8220}

# Default local database (always available)
spring.datasource.url=jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# 64-byte key in Base64 (replace in production)
app.jwt.secret=${APP_JWT_SECRET:ZmFrZV9zZWNyZXRfZm9yX2Rldl9vbmx5XzMyX2J5dGVzX2tleV8xMjM0NTY=}
app.jwt.access-token-expiration-minutes=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}
app.jwt.issuer=${APP_JWT_ISSUER:coifure-auth-service}

# Eureka client
# Disabled by default for local development; enable with EUREKA_ENABLED=true
spring.cloud.discovery.enabled=${EUREKA_ENABLED:false}
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
