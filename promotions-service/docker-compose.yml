services:
  postgres:
    image: postgres:16-alpine
    container_name: promotion-postgres
    environment:
      POSTGRES_DB: promotion_db
      POSTGRES_USER: promotion_user
      POSTGRES_PASSWORD: promotion_password
    ports:
      - "5432:5432"
    volumes:
      - promotion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U promotion_user -d promotion_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  promotion-service:
    build: .
    container_name: promotion-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8898
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promotion_db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: promotion_user
      SPRING_DATASOURCE_PASSWORD: promotion_password
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      EUREKA_ENABLED: "false"
      DISCOVERY_ENABLED: "false"
      EVENTS_ENABLED: "false"
    ports:
      - "8898:8898"

volumes:
  promotion_pg_data:
