spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:promotiondb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false

app:
  events:
    enabled: false
