server:
  port: ${HTTP_PORT:8896}
  forward-headers-strategy: framework

spring:
  profiles:
    default: dev
  application:
    name: reservation-service
  cloud:
    discovery:
      enabled: ${SPRING_CLOUD_DISCOVERY_ENABLED:false}
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

integration:
  services:
    enabled: ${INTEGRATION_SERVICES_ENABLED:false}
    connect-timeout-ms: ${INTEGRATION_SERVICES_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${INTEGRATION_SERVICES_READ_TIMEOUT_MS:3000}
    user-by-id-url-template: ${INTEGRATION_USER_BY_ID_URL_TEMPLATE:http://localhost:8081/api/users/{id}}
    salon-by-id-url-template: ${INTEGRATION_SALON_BY_ID_URL_TEMPLATE:http://localhost:8082/api/salons/{id}}
    hairdresser-by-id-url-template: ${INTEGRATION_HAIRDRESSER_BY_ID_URL_TEMPLATE:http://localhost:8083/api/hairdressers/{id}}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
