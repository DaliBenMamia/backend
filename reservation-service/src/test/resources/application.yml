spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:reservation_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  security:
    enabled: false

eureka:
  client:
    enabled: false

integration:
  services:
    enabled: false
